name: Windows release readiness
on: workflow_dispatch
permissions:
  contents: read
jobs:
  readiness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run release:check
# Bramka zatrzymuje publikację do wdrożenia Electron/NSIS i testów Windows.
