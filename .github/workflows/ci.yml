name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: reports/
