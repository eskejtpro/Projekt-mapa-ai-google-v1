name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Windows quality gate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify code, automation and tests
        run: npm run verify
      - name: Electron gallery E2E
        run: npm run test:e2e:electron
      - name: Prepare checksum-verified portable video test tools
        shell: pwsh
        run: ./scripts/setup-video-test-tools.ps1
      - name: Real video GPS metadata
        run: npm run test:video-gps-real
      - name: Real Electron codecs, offline map and library backup
        run: npm run test:video-playback-real
      - name: Electron desktop restart
        run: npm run test:desktop-restart
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
