# .codex/config.toml - Konfiguracja reguł inżynieryjnych i narzędzi weryfikacji

[project]
name = "Android Architecture & Advisory Studio"
target_platform = "Android SDK 35 (VanillaIceCream) / Min SDK 26"
language = "Kotlin 2.0.21"
ui_framework = "Jetpack Compose + Material 3"
state_management = "StateFlow / SharedFlow with Lifecycle 2.8+"
database = "Room 2.6+ (Offline-First SSOT)"
preferences = "DataStore Preferences"
di = "Dagger Hilt 2.52"

[quality_gates]
ktlint_enabled = true
detekt_enabled = true
android_lint_abort_on_error = true
unit_test_coverage_threshold = 80
enforce_offline_first = true
forbid_main_thread_io = true
forbid_livedata_in_compose = true # Wymagany StateFlow + collectAsStateWithLifecycle

[verification_commands]
build = "./gradlew assembleDebug"
test = "./gradlew testDebugUnitTest"
lint = "./gradlew lintDebug"
detekt = "./gradlew detekt"
ktlint = "./gradlew ktlintCheck"
